portfolio:
  name: paper-us
  enabled: true
  initial_cash: 100000
  max_positions: 10
  position_size_pct: 0.10
  long_only: true
  # stop_loss_pct: 0.08  # optional — disabled by default

schedule:
  timezone: America/New_York
  run_after_close: true

risk:
  max_daily_loss_pct: 0.05
  max_drawdown_pct: 0.20
  liquidate_on_trip: false

costs:
  model: equity
  commission_per_trade: 1.00
  slippage_pct: 0.0005

defaults:
  # ml_movement falls back to HOLD until a model is trained for a ticker
  # (via the /api/train/<ticker> endpoint), so it's safe to enable by default.
  strategies: [ma_crossover, ml_movement]
  signal_mode: consensus
  ml_confidence_threshold: 0.55
  ma_short: 20
  ma_long: 50

positions:
  - ticker: AAPL
  - ticker: MSFT
  - ticker: GOOGL
