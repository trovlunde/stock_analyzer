services:
  stock-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback only — the API has no auth, and Docker's port publishing bypasses
      # host firewalls like ufw. Reach it via Tailscale or `ssh -L 5000:localhost:5000`.
      - "127.0.0.1:5000:5000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=False
      - FLASK_PORT=5000
      - FLASK_HOST=0.0.0.0
      - DATABASE_URL=sqlite:////app/data/stock_analysis.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  trader:
    build:
      context: .
      dockerfile: Dockerfile
    # Both paper portfolios run at the same slot; each keeps its own state.
    command:
      - uv
      - run
      - stock-analysis-trader
      - --config
      - config/portfolio.yaml
      - config/portfolio-etf-trend.yaml
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/stock_analysis.db
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "test $(($(date +%s) - $(stat -c %Y /app/data/heartbeat))) -lt 600"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
